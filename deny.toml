# Supply-chain policy, checked by `cargo deny check` (CI runs it on every push).
#
# What it guards: no dependency with a known vulnerability or a yanked version, only licences
# compatible with the AGPL-3.0 (every permissive licence below is), nothing fetched from anywhere but crates.io, and no second copy
# of a crate that is easy to avoid. A new dependency is a decision: justify it in the change.

[graph]
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
yanked = "deny"
# An advisory is ignored only with a reason and a date to look again, never silently.
ignore = [
  # basic-toml is unmaintained (no vulnerability). It is reached only through askama, the template engine of
  # UniFFI's Swift generator: a tool that runs at build time, never part of what is shipped. Look again
  # when UniFFI moves off it, or on 2027-02-01 at the latest.
  { id = "RUSTSEC-2026-0374", reason = "unmaintained, build-time only (UniFFI's Swift generator), no vulnerability" },
]

[licenses]
# Every licence a dependency may carry. Anything else fails until it is looked at.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  # This project's own licence (the workspace crates are in the graph).
  "AGPL-3.0-or-later",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  # The client's TLS (ring, rustls-webpki, untrusted: ISC; its trusted roots: CDLA).
  "ISC",
  "CDLA-Permissive-2.0",
  "Unlicense",
]
# MPL-2.0 is a weak, per-file copyleft: it binds only changes made to the files of those crates, which we do
# not make. Allowed for UniFFI alone (the Swift interface of the apps), never for the project at large.
exceptions = [
  { allow = ["MPL-2.0"], crate = "uniffi" },
  { allow = ["MPL-2.0"], crate = "uniffi_bindgen" },
  { allow = ["MPL-2.0"], crate = "uniffi_core" },
  { allow = ["MPL-2.0"], crate = "uniffi_internal_macros" },
  { allow = ["MPL-2.0"], crate = "uniffi_macros" },
  { allow = ["MPL-2.0"], crate = "uniffi_meta" },
  { allow = ["MPL-2.0"], crate = "uniffi_pipeline" },
  { allow = ["MPL-2.0"], crate = "uniffi_udl" },
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
# Two versions of one crate is a warning to look at, not a failure.
multiple-versions = "warn"
wildcards = "deny"
# The crates of this workspace refer to each other by path (memcp-health, the health referential, adds only serde,
# serde_json and unicode-normalization, all already in the graph).
allow-wildcard-paths = true
# Crates this project does not want, with the reason.
deny = [
  # A TLS stack or an HTTP client would make the server reach out; it is memory only.
  # The exceptions are `memcp-client`, which programs that reach the memory use (the janitor, the sync program), and the
  # node's speech call (`memcp-server`, `intake::whisper`: an OpenAI-compatible speech service, only when the person turns it
  # on): rustls may be used by `ureq` and by nothing else.
  { crate = "reqwest", reason = "the server fetches nothing" },
  { crate = "hyper-util", reason = "the server fetches nothing" },
  { crate = "openssl", reason = "no TLS stack: HTTPS is the proxy's job" },
  { crate = "openssl-sys", reason = "no TLS stack: HTTPS is the proxy's job" },
  { crate = "native-tls", reason = "no TLS stack: HTTPS is the proxy's job" },
  { crate = "rustls", wrappers = ["ureq"], reason = "no TLS stack in the server: only the client (ureq) has one" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
