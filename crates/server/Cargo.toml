[package]
publish = false
name = "memcp-server"
description = "memcp server: MCP over HTTP, connections, the admin page, command line"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
memcp-core = { path = "../core" }
memcp-finances = { path = "../finances" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tiny_http = "0.12"

[dev-dependencies]
base64 = "0.22"
sha2 = "0.11.0"

[lints]
workspace = true

[[bin]]
name = "memcp"
path = "src/main.rs"
