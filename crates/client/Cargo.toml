[package]
publish = false
name = "memcp-client"
description = "memcp client: a connection's address, as a program sees it (MCP over HTTP, deposits by batch, files, retries)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
serde_json = "1.0.154"
# The TLS client of the project (see deny.toml): the memory itself has none.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
base64 = "0.22"
# The synchronisation between peers (memcp-sync) writes this node's memory: only with the `sync` feature, so that the
# libraries embedding this client (bridge-ffi in the apps) do not take the memory's SQLite with it.
memcp-core = { path = "../core", optional = true }

[features]
sync = ["dep:memcp-core"]

[[bin]]
name = "memcp-sync"
required-features = ["sync"]

[dev-dependencies]
memcp-core = { path = "../core" }
memcp-server = { path = "../server" }
tiny_http = "0.12"

[lints]
workspace = true
