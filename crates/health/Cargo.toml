[package]
name = "memcp-health"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
description = "The health referential (signs, measures, vital constants, red flags) as embedded data, and the deterministic detection of them in a text; no model, no I/O"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
# The same folding of accents as memcp-core (already in the dependency graph).
unicode-normalization = "0.1.26"

[lints]
workspace = true
