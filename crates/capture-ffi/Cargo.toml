[package]
publish = false
name = "memcp-capture-ffi"
description = "The Swift interface (UniFFI) of the memcp capture program, for the Mac app: a thin shell, no logic of its own"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "memcp_capture_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
memcp-capture = { path = "../capture" }
memcp-client = { path = "../client" }
memcp-core = { path = "../core" }
uniffi = { version = "0.32", features = ["cli"] }

# Whisper inside the app, on the GPU: the Mac only.
[target.'cfg(target_os = "macos")'.dependencies]
memcp-capture = { path = "../capture", features = ["metal"] }

[lints]
workspace = true
