name: Cartafolio
version: "20261121.1.0"
slug: memcp
description: Cartafolio, durable memory for AI assistants over MCP, one memory per person, organised in spaces
url: https://github.com/WilliamFriconneau/cartafolio-core
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:brain
panel_title: Memory
# Every Home Assistant user may open the page; each sees their own memory.
panel_admin: false
ports:
  8791/tcp: 8791
  8792/tcp: 8792
ports_description:
  8791/tcp: MCP and OAuth (tokens travel in clear on this port; put Tailscale or a TLS proxy in front)
  8792/tcp: The consent page and the page of this node, for the tailnet (answers only the address set in identity_trust)
# The databases are copied while the add-on is stopped: a consistent backup.
backup: cold
# The app's own configuration folder: where the data of another installation is left to be taken in once.
map:
  - addon_config:rw
  # Folders the node can watch (`watch`): what is added to them becomes notes and files.
  - share:rw
  - media:rw
hassio_api: false
homeassistant_api: false
options:
  node_name: Cartafolio
  language: en
  admins: []
  new_people: auto
  public_url: ""
  identity_trust: ""
  login_url: ""
  tailnet_users: []
  janitor: false
  janitor_person: ""
  janitor_inboxes: []
  janitor_work_words: []
  janitor_quiet: 120
  janitor_night: "03:00"
  janitor_api_url: ""
  janitor_api_model: ""
  janitor_api_key: ""
  janitor_ollama_url: ""
  janitor_ollama_model: "qwen3:8b"
  transcribe: false
  transcribe_person: ""
  transcribe_spaces: ""
  transcribe_api_url: ""
  transcribe_api_model: "whisper-1"
  transcribe_api_key: ""
  transcribe_language: ""
  transcribe_hints: true
  intake_person: ""
  watch: []
schema:
  node_name: str?
  language: list(en|fr)
  admins:
    - str
  new_people: list(auto|ask)?
  public_url: str?
  identity_trust: match(^(([0-9]{1,3}\.){3}[0-9]{1,3})?$)
  login_url: str?
  tailnet_users:
    - match(^[^=\s]+=[a-z][a-z0-9-]{0,39}$)
  janitor: bool
  janitor_person: str?
  janitor_inboxes:
    - str
  janitor_work_words:
    - str
  janitor_quiet: int(10,86400)
  janitor_night: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  janitor_api_url: str?
  janitor_api_model: str?
  janitor_api_key: password?
  janitor_ollama_url: str?
  janitor_ollama_model: str?
  transcribe: bool?
  transcribe_person: str?
  transcribe_spaces: str?
  transcribe_api_url: str?
  transcribe_api_model: str?
  transcribe_api_key: password?
  transcribe_language: str?
  transcribe_hints: bool?
  intake_person: str?
  watch:
    - str
