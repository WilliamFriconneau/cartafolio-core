# memcp.toml: the settings of this node. Every option is listed with its default.
# A line that starts with # is a default left alone: remove the # to change it.
# A flag on the command line wins over this file. Check it with `memcp config check`.
# The same options as the Home Assistant app: docs/PARITY.md.

# --- Where things are --------------------------------------------

# The data directory: one SQLite file per space, the control database, the
# files. Private to its owner (0700). Back it up with `memcp backup`, never by
# copying it while the node runs.
# data = "/var/lib/memcp"

# The address this node listens on. The loopback by default: put a TLS proxy
# or Tailscale serve in front (docs/LINUX.md).
# listen = "127.0.0.1:8791"

# Allow `listen` to be an address other than the loopback. Keys travel in
# clear on this port: only behind a firewall that lets nothing from outside
# through, or with a proxy on the same machine.
# allow_remote = false

# Worker threads of this node's HTTP server (1 to 1024).
# threads = 4

# Announce this node on the local network (mDNS) so that another machine finds
# it without typing an address.
# advertise = false

# Web origins a browser page may call this node from (a list of URLs). Empty:
# none.
# allow_origin = []

# Serve the node page (`/admin`) on `listen` with a console token. On by
# itself while `listen` is the loopback; never through Tailscale Funnel.
# console_admin = false

# Connection names that must read the memory before writing. Use ["*"] for all
# except apps, peers, consoles and the janitor. Empty: off.
# strict_write_agents = []

# Extra redirect addresses accepted by the OAuth sign-in of an assistant (a
# list of URLs).
# oauth_redirect = []

# --- The node ----------------------------------------------------

# The name of this node, shown to the other nodes of your memory and on the
# network.
# node_name = "Pensine"

# The search language of a new memory (`en` or `fr`). It is written once, by
# `memcp setup` or `init`; changing it later needs a reindex.
# language = "en"

# The address assistants reach, `https://...`, with no slash at the end.
# Empty: the loopback address.
# public_url = ""

# --- Who may sign in ---------------------------------------------

# Logins that administer the installation when the page is opened through an
# ingress listener. Empty: the first login. Not used for the console token or
# the tailnet.
# admins = []

# Only for `pensine-manager` (several people on one node): `auto` gives every
# new login a memory of their own, `ask` makes them wait for an administrator.
# `memcp serve` holds one memory and ignores it.
# new_people = "auto"

# The address of the identity listener: the consent page of Claude on the web
# and the node page for the tailnet. Put it behind `tailscale serve` (never
# Funnel), for example `127.0.0.1:8792`. Empty: none.
# identity_listen = ""

# The one address (an IP) whose `Tailscale-User-Login` header is believed on
# the identity listener. Empty: the loopback only.
# identity_trust = ""

# The public address of the identity listener, where the consent page of an
# assistant is shown.
# login_url = ""

# Tailnet logins allowed on the node page, each as `login=person` (for example
# `you@example.org=owner`). Anyone else is refused.
# tailnet_users = []

# --- The janitor -------------------------------------------------

# Run the janitor (`pensine-janitor.service`): it files the notes of the
# inboxes with the model named below.
# janitor = false

# The person whose inboxes it files.
# janitor_person = "owner"

# The spaces whose inbox it files. Empty: every space its key reaches.
# janitor_inboxes = []

# Words that mark a note as being about your work: it goes to the work space
# before any model.
# janitor_work_words = []

# Seconds after the last write into an inbox before it files (10 to 86400).
# janitor_quiet = 120

# The hour of the nightly pass, `HH:MM`.
# janitor_night = "03:00"

# An OpenAI-compatible service the janitor may ask. Empty: none. Your notes
# leave this machine for it.
# janitor_api_url = ""

# The model asked at that service.
# janitor_api_model = ""

# A file that holds the key of that service (mode 0600). The key itself is
# never written here.
# janitor_api_key_file = ""

# An Ollama on this machine or another, for example `http://127.0.0.1:11434`.
# Empty: none.
# janitor_ollama_url = ""

# The model asked of that Ollama.
# janitor_ollama_model = "qwen3:8b"

# --- Voice notes -------------------------------------------------

# Read voice notes: the node turns a recording waiting in an inbox into text,
# by the speech model on this machine (`transcribe_model`) or by the speech
# service below. With a service, the recording leaves this machine for it.
# transcribe = false

# The person whose recordings are read. Empty: `intake_person`, then
# `janitor_person`.
# transcribe_person = ""

# The spaces whose recordings are read, comma separated, or `all`. Empty:
# every space the person writes to, one made later included.
# transcribe_spaces = ""

# An OpenAI-compatible speech service (`.../v1/audio/transcriptions`).
# transcribe_api_url = ""

# The speech model asked at that service.
# transcribe_api_model = "whisper-1"

# A file that holds the key of that service (mode 0600).
# transcribe_api_key_file = ""

# The language of the recordings (`en`, `fr`...). Empty: the model finds it.
# transcribe_language = ""

# Seconds between two passes over the recordings waiting in the inboxes.
# transcribe_every = 60

# A whisper.cpp speech model (a `ggml-*.bin` file) on this machine: the
# recordings are read here and leave nowhere. Needs `whisper-cli` and
# `ffmpeg`.
# transcribe_model = ""

# The whisper.cpp program that reads a recording with `transcribe_model`.
# transcribe_cmd = "whisper-cli"

# The `ffmpeg` program that makes a recording readable by the speech model.
# transcribe_ffmpeg = "ffmpeg"

# Threads the speech model uses.
# transcribe_threads = 8

# A Markdown table of terms and their wrong spellings, to help the speech
# model and to correct what it wrote.
# transcribe_lexicon = ""

# Guided transcription: tell the speech model the words this memory says you
# use (names that recur in your notes, the keywords and vocabularies of your
# spaces, health terms) as its initial prompt. With a speech service, those
# words go to it with the recording.
# transcribe_hints = true

# --- Folders -----------------------------------------------------

# The person whose memory the voice notes, the watched folders and the
# absorbed folders work for. Empty: `transcribe_person`, then
# `janitor_person`, then the first administrator.
# intake_person = ""

# Folders watched, each as `FOLDER -> SPACE`: a file added to the folder
# becomes a note (Markdown, text), a recording (audio) or a file of that
# space's inbox. Without `-> SPACE`, it goes to the person's to-sort box. The
# files stay where they are. A folder is taken in whole on the first look: use
# one made for it.
# watch = []

# Seconds between two looks at the watched folders.
# watch_every = 10

# Folders of notes kept up to date on this machine, each as `FOLDER -> SPACE`:
# what is new in them goes to that space's inbox, cut at the headings, and the
# janitor draws facts from it. The first pass only takes stock.
# absorb = []

# Folders of an absorbed folder that are never read (relative names).
# absorb_exclude = []

# Words that keep a file of an absorbed folder closed when its name holds one.
# absorb_protect = []

# A Markdown table `Name | Post`: a name is never sent from an absorbed
# folder, its post is.
# absorb_roles = ""

# Minutes between two passes over the absorbed folders.
# absorb_every = 15

# Proposals put down as files, each as `SPACE TAG -> FOLDER`: a fact of the
# space tagged `TAG` (`proposals/pro`) is written once as a file in the
# folder.
# deliver = []

# --- Backups -----------------------------------------------------

# Where `memcp backup` (and `memcp-backup.timer`) puts a consistent copy.
# Outside the data directory, ideally on another disk.
# backup_dir = "/var/backups/memcp"

# How many backups are kept; the oldest are removed.
# backup_keep = 14
