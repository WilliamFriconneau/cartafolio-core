[workspace]
resolver = "2"
members = ["crates/core", "crates/finances", "crates/server", "crates/manager", "crates/client", "crates/janitor", "crates/capture-ffi", "crates/spaces"]

[workspace.package]
version = "20261117.0.13"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/WilliamFriconneau/memcp-core"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
