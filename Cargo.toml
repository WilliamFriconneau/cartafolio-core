[workspace]
resolver = "2"
members = ["crates/core", "crates/finances", "crates/server", "crates/manager", "crates/client", "crates/janitor", "crates/capture-ffi", "crates/spaces", "crates/health", "crates/bench"]
exclude = ["vendor/tiny_http"]

[workspace.package]
version = "20261117.0.34"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/WilliamFriconneau/memcp-core"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"

# tiny_http with fixes of ours (see vendor/tiny_http/Cargo.toml): every connection gets a thread, a body left unread is
# drained without allocating its declared size, and a silent connection can be closed after a read timeout.
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }
