# The desktop node, installed for real on a Mac and on Windows: the installers of packaging/ run with the programs of
# this commit, the node starts as a task of the user, a note and a file reach « À trier » through the node's own commands,
# an assistant's request goes through the node's address with the key of its connection, then everything is removed.
name: desktop

on:
  push:
    branches: [main]
    paths: ["packaging/**", "crates/capture/**", "crates/server/**", "crates/core/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["packaging/**", "crates/capture/**", "crates/server/**", "crates/core/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --locked -p memcp-server -p memcp-janitor
      - name: Install
        run: sh packaging/macos/install-mac.sh --yes --from target/release --port 18791
      - name: A note, a file and an assistant's request through the node
        run: |
          APP="$HOME/Library/Application Support/MemCP"
          M="$APP/bin/memcp"
          URL=http://127.0.0.1:18791/mcp/desktop
          launchctl list | grep org.memcp
          test -f "$APP/memcp.toml"
          "$M" --data "$APP/data" intake text "a note from the desktop test"
          printf 'a file\n' > file.txt
          "$M" --data "$APP/data" intake send file.txt
          KEY=$(security find-generic-password -s memcp -a "$URL" -w)
          curl -fsS -X POST "$URL" -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | tee answers.txt
          grep -q '"tools"' answers.txt
          "$M" --data "$APP/data" space list | tee spaces.txt
          grep -q 'owner-a-trier' spaces.txt
      - name: Logs
        if: always()
        run: tail -n 50 "$HOME/Library/Logs/MemCP/"*.log || true
      - name: Uninstall
        run: |
          sh packaging/macos/install-mac.sh --uninstall --purge --yes --port 18791
          ! launchctl list | grep org.memcp
          ! ls "$HOME/Library/LaunchAgents/" | grep org.memcp
          ! test -e "$HOME/Library/Application Support/MemCP"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release --locked -p memcp-server -p memcp-janitor
      - name: Install
        shell: pwsh
        run: ./packaging/windows/install.ps1 -Yes -From target\release -Port 18791
      - name: A note, a file and an assistant's request through the node
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'MemCP'
          $m = Join-Path $root 'bin\memcp.exe'
          $data = Join-Path $root 'data'
          Get-ScheduledTask -TaskPath '\MemCP\' | Format-Table TaskName, State
          if (-not (Test-Path (Join-Path $root 'memcp.toml'))) { throw 'no settings file' }
          & $m --data $data intake text "a note from the desktop test"
          if ($LASTEXITCODE -ne 0) { throw "text: $LASTEXITCODE" }
          Set-Content -Path file.txt -Value 'a file'
          & $m --data $data intake send file.txt
          if ($LASTEXITCODE -ne 0) { throw "send: $LASTEXITCODE" }
          $key = (Get-Content (Join-Path $root 'keys\desktop.key') -Raw).Trim()
          $answers = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:18791/mcp/desktop `
            -Headers @{ Authorization = "Bearer $key"; Accept = 'application/json, text/event-stream' } `
            -ContentType 'application/json' -Body '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          $answers | ConvertTo-Json -Depth 5
          if (-not $answers.result.tools) { throw 'no tools through the node' }
          $spaces = & $m --data $data space list
          $spaces
          if (-not ($spaces -match 'owner-a-trier')) { throw 'no À trier' }
      - name: Logs
        if: always()
        shell: pwsh
        run: Get-ChildItem (Join-Path $env:LOCALAPPDATA 'MemCP\logs') -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 50 }
      - name: Uninstall
        shell: pwsh
        run: |
          ./packaging/windows/install.ps1 -Uninstall -Purge -Yes
          if (Get-ScheduledTask -TaskPath '\MemCP\' -ErrorAction SilentlyContinue) { throw 'tasks left' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'MemCP')) { throw 'files left' }
