name: Release

# A tag `vX.Y.Z` builds static binaries, an SBOM, signed build provenance, and a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            short: linux-x64
          - target: aarch64-unknown-linux-musl
            short: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build with cross
        # memcp-health (the health referential, docs/HEALTH.md) is a library with no binary: it is built into
        # memcp-server and memcp-janitor, which depend on it, and needs no line of its own here.
        run: |
          cargo install cross --locked
          cross build --release --locked --target ${{ matrix.target }} -p memcp-server -p memcp-manager -p memcp-janitor
          # Apart: `--bin` would apply to every package of the line above.
          cross build --release --locked --target ${{ matrix.target }} -p memcp-client --features sync --bin memcp-sync
      - name: Package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/memcp dist/pensine-${{ matrix.short }}
          cp target/${{ matrix.target }}/release/memcp-manager dist/pensine-manager-${{ matrix.short }}
          cp target/${{ matrix.target }}/release/memcp-janitor dist/pensine-janitor-${{ matrix.short }}
          cp target/${{ matrix.target }}/release/memcp-sync dist/pensine-sync-${{ matrix.short }}
          # The archive install.sh installs from: programs, units, memcp.toml (see packaging/linux).
          V=${GITHUB_REF_NAME#v}
          n=pensine-$V-${{ matrix.short }}
          mkdir -p pkg/$n/bin pkg/$n/units
          for b in memcp memcp-janitor memcp-manager memcp-sync; do cp target/${{ matrix.target }}/release/$b pkg/$n/bin/; done
          cp packaging/linux/*.service packaging/linux/*.timer packaging/linux/memcp.sysusers packaging/linux/memcp.tmpfiles pkg/$n/units/
          cp packaging/linux/memcp.toml docs/LINUX.md LICENSE install.sh pkg/$n/
          tar -C pkg -czf dist/$n.tar.gz $n
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*

  native:
    # The node for the computers: macOS and Windows build on their own runners.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            short: macos-arm64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            short: windows-x64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p memcp-server -p memcp-janitor -p memcp-manager
          cargo build --release --locked --target ${{ matrix.target }} -p memcp-client --features sync --bin memcp-sync
      - name: Package
        shell: bash
        run: |
          mkdir dist
          for b in memcp memcp-janitor memcp-manager memcp-sync; do
            cp "target/${{ matrix.target }}/release/${b}${{ matrix.ext }}" "dist/pensine${b#memcp}-${{ matrix.short }}${{ matrix.ext }}"
          done
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            V=${GITHUB_REF_NAME#v}
            stage="Pensine-$V"
            mkdir -p "$stage"
            for b in memcp memcp-janitor memcp-manager memcp-sync; do
              cp "target/${{ matrix.target }}/release/$b" "$stage/pensine${b#memcp}"
            done
            cat > "$stage/README.txt" <<EOF
          Pensine $V for Apple silicon.
          These programs work together: keep them in the same folder.
          Where the memory lives and how to serve it: https://github.com/${{ github.repository }}/blob/main/docs/LINUX.md
          EOF
            hdiutil create -volname "Pensine $V" -srcfolder "$stage" -ov -format UDZO "dist/Pensine-$V-macos-arm64.dmg"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --spec-version 1.5 --all
          mkdir dist
          cp crates/server/memcp-server.cdx.json dist/pensine-${{ github.ref_name }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/*

  release:
    needs: [build, native, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      # Signed provenance is offered for public repositories only.
      - name: Signed build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
