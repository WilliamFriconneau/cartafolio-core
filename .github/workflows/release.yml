name: Release

# A tag `vX.Y.Z` builds static binaries, an SBOM, signed build provenance, and a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build with cross
        run: |
          cargo install cross --locked
          cross build --release --locked --target ${{ matrix.target }} -p memcp-server -p memcp-manager -p memcp-janitor -p memcp-bridge -p memcp-client --bin memcp-sync
      - name: Package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/memcp dist/memcp-${{ github.ref_name }}-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/memcp-manager dist/memcp-manager-${{ github.ref_name }}-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/memcp-janitor dist/memcp-janitor-${{ github.ref_name }}-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/memcp-bridge dist/memcp-bridge-${{ github.ref_name }}-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/memcp-sync dist/memcp-sync-${{ github.ref_name }}-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*

  native:
    # The server and the bridge for the computers: macOS and Windows build on their own runners.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p memcp-server -p memcp-janitor -p memcp-bridge -p memcp-client --bin memcp-sync
      - name: Package
        shell: bash
        run: |
          mkdir dist
          for b in memcp memcp-janitor memcp-bridge memcp-sync; do
            cp "target/${{ matrix.target }}/release/${b}${{ matrix.ext }}" "dist/${b}-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.ext }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --spec-version 1.5 --all
          mkdir dist
          cp crates/server/memcp-server.cdx.json dist/memcp-${{ github.ref_name }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/*

  release:
    needs: [build, native, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      # Signed provenance is offered for public repositories only.
      - name: Signed build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
