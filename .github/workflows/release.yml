name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: pensine-linux-x64
          - target: aarch64-unknown-linux-musl
            asset: pensine-linux-arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify versions
        shell: bash
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          addon=$(sed -n 's/^version: "\(.*\)"$/\1/p' ha-addon/pensine/config.yaml)
          build_arg=$(sed -n 's/^  PENSINE_VERSION: "\(.*\)"$/\1/p' ha-addon/pensine/build.yaml)
          if [[ -z "$crate" || "$GITHUB_REF_NAME" != "v$crate" || "$crate" != "$addon" || "$crate" != "$build_arg" ]]; then
            echo "Tag, workspace version, add-on version, and build argument must agree." >&2
            exit 1
          fi
      - name: Build static binary with cross
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        shell: bash
        run: |
          cargo install cross --version 0.2.5 --locked
          cross rustc --release --locked --target "$TARGET" -p pensine --bin pensine -- \
            -C relocation-model=static -C link-arg=-static
          mkdir dist
          cp "target/$TARGET/release/pensine" "dist/$ASSET"
          headers=$(readelf -l "dist/$ASSET")
          if grep -q 'INTERP' <<< "$headers"; then
            echo "$ASSET needs a dynamic loader." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pensine-linux-*
          path: dist
          merge-multiple: true
      - name: Publish binaries and checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum pensine-linux-x64 pensine-linux-arm64 > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes pensine-linux-x64 pensine-linux-arm64 SHA256SUMS
