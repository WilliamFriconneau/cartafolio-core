name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  addon-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The add-on, the build argument and the crates carry one version
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          addon=$(sed -n 's/^version: "\(.*\)"/\1/p' ha-addon/memcp/config.yaml)
          arg=$(sed -n 's/^  MEMCP_VERSION: "\(.*\)"/\1/p' ha-addon/memcp/build.yaml)
          echo "crates $crate, add-on $addon, build argument $arg"
          [ "$crate" = "$addon" ] && [ "$addon" = "$arg" ]
