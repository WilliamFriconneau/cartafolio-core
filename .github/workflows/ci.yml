name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  e2e:
    # Real processes: the programs of the project talk to each other on loopback ports (scripts/e2e.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/e2e.sh

  page:
    # The node page in a browser, against the real program: crates/server/tests/page (README.md there). e2e.test.js
    # and wizard.test.js run in jsdom; the others drive the Chrome of the runner through playwright-core.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p memcp-server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install jsdom and playwright-core
        working-directory: crates/server/tests/page
        run: npm install jsdom playwright-core --no-save
      - name: Every page test
        working-directory: crates/server/tests/page
        env:
          MEMCP_BIN: ${{ github.workspace }}/target/debug/memcp
          CHROMIUM: /usr/bin/google-chrome
        run: |
          status=0
          for t in *.test.js; do
            echo "::group::$t"
            node "$t" || { echo "::error::$t failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  addon-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The add-on, the build argument and the crates carry one version
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          addon=$(sed -n 's/^version: "\(.*\)"/\1/p' ha-addon/memcp/config.yaml)
          arg=$(sed -n 's/^  MEMCP_VERSION: "\(.*\)"/\1/p' ha-addon/memcp/build.yaml)
          echo "crates $crate, add-on $addon, build argument $arg"
          [ "$crate" = "$addon" ] && [ "$addon" = "$arg" ]

  portable:
    # The node must build on the systems they are for: macOS and Windows as well as Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build everything
        run: cargo build --workspace --locked
      - name: Tests
        run: cargo test --workspace --locked --no-fail-fast

  linux-app:
    # The Linux server app: the units, the packages and the program started from them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p memcp-server -p memcp-janitor
      - name: Smoke test (setup, serve, discovery, a connection, remember and recall, the page, doctor, backup)
        run: scripts/linux-smoke.sh target/release/memcp
      - name: The example memcp.toml is the documented one
        run: |
          target/release/memcp config example | diff - packaging/linux/memcp.toml
      - name: Units
        run: |
          sudo install -m 755 target/release/memcp target/release/memcp-janitor /usr/bin/
          sudo useradd --system --no-create-home memcp || true
          systemd-analyze verify packaging/linux/memcp.service packaging/linux/memcp-backup.service \
            packaging/linux/memcp-janitor.service \
            packaging/linux/memcp-backup.timer
      - name: Debian package
        run: |
          packaging/linux/build-deb.sh
          sudo apt-get install -y ./target/debian/memcp_*.deb
          test -f /etc/memcp/memcp.toml
          scripts/linux-smoke.sh /usr/bin/memcp
          sudo apt-get remove -y memcp
          test -f /etc/memcp/memcp.toml
      - name: Release archive
        run: |
          packaging/linux/build-tarball.sh
          d=$(mktemp -d)
          tar -C "$d" -xzf target/tarball/memcp-*.tar.gz
          sh -n "$d"/memcp-*/install.sh
          scripts/linux-smoke.sh "$d"/memcp-*/bin/memcp

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm git rust systemd curl
      - uses: actions/checkout@v4
      - name: Build the package from this checkout
        run: |
          useradd -m builder
          chown -R builder .
          git config --global --add safe.directory "$PWD"
          cd packaging/linux
          su builder -c "MEMCP_SRC=$(cd ../.. && pwd) makepkg --nocheck --noconfirm -f"
      - name: Install it and run it
        run: |
          pacman -U --noconfirm packaging/linux/memcp-*.pkg.tar.zst
          test -f /etc/memcp/memcp.toml
          systemd-sysusers /usr/lib/sysusers.d/memcp.conf
          scripts/linux-smoke.sh /usr/bin/memcp
